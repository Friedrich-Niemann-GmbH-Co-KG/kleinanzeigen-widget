
name: Kleinanzeigen synchronisieren

on:
  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: kleinanzeigen-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Kleinanzeigen API synchronisieren
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repository aktualisieren
        run: |
          git pull --rebase origin main

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Anzeigen abrufen
        env:
          KLAZ_API_KEY: ${{ secrets.KLAZ_API_KEY }}
          KLAZ_SELLER_ID: ${{ secrets.KLAZ_SELLER_ID }}
        run: |
          python sync.py

      - name: Anzeigen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ads.json

          if ! git diff --cached --quiet; then
            git commit -m "Automatische Kleinanzeigen-Aktualisierung"
            git pull --rebase origin main
            git push origin main
          else
            echo "Keine Änderungen an den Anzeigen."
          fi

      - name: Synchronisierung abgeschlossen
        run: |
          echo "Kleinanzeigen-Synchronisierung erfolgreich."
